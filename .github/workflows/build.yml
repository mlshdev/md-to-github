name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch or tag to build. Defaults to the triggering commit."
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to build and publish."
        type: string
        required: false
        default: ""
      reason:
        description: "Why the rebuild was triggered. Recorded in the run summary."
        type: string
        required: false
        default: "push"
    outputs:
      image:
        description: "Fully qualified image reference that was published."
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: "Digest of the published image."
        value: ${{ jobs.publish.outputs.digest }}
      build:
        description: "Immutable build tag that was published alongside latest."
        value: ${{ jobs.publish.outputs.build }}

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PLATFORM: linux/arm64
  CACHE_SCOPE: linux-arm64
  SMOKE_TAG: markdown-mermaid-renderer:smoke

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Read the Bun version pinned in the Dockerfile
        id: toolchain
        run: |
          set -euo pipefail
          version="$(sed -n 's|^FROM docker\.io/oven/bun:\([0-9][0-9A-Za-z.-]*\)@sha256:.*|\1|p' Dockerfile | head -n 1)"
          test -n "${version}"
          printf 'bun=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.toolchain.outputs.bun }}

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build

  publish:
    name: Build and publish linux/arm64
    needs: verify
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.context.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      build: ${{ steps.context.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # Tag scheme: `latest` and the package.json version move; the dated build
      # tag and the commit tag are immutable and are what deployments pin.
      - name: Resolve image coordinates and version
        id: context
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          version="$(jq -er '.version' package.json)"
          revision="$(git rev-parse HEAD)"
          {
            printf 'image=%s\n' "${image}"
            printf 'version=%s\n' "${version}"
            printf 'revision=%s\n' "${revision}"
            printf 'build=%s-%s.%s\n' "${version}" "$(date -u '+%Y%m%d')" "${GITHUB_RUN_NUMBER}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.context.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.context.outputs.version }}
            type=raw,value=${{ steps.context.outputs.build }}
            type=raw,value=sha-${{ steps.context.outputs.revision }}
          labels: |
            org.opencontainers.image.title=markdown-mermaid-renderer
            org.opencontainers.image.version=${{ steps.context.outputs.build }}
            org.opencontainers.image.revision=${{ steps.context.outputs.revision }}

      - name: Build the image for smoke testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.IMAGE_PLATFORM }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.SMOKE_TAG }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,scope=${{ env.CACHE_SCOPE }},mode=max

      # An unattended base-image or dependency bump must not publish an image
      # that cannot serve a request, so the container has to answer before push.
      - name: Smoke test the container
        run: .github/scripts/smoke-test.sh "${SMOKE_TAG}"

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

      - name: Verify the published image is linux/arm64
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
            | jq -e 'if .manifests then ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) >= 1 else true end' > /dev/null
        env:
          IMAGE: ${{ steps.context.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Summarise the run
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # backticks below are Markdown, not command substitution
          {
            printf '## %s\n\n' "${TITLE}"
            printf -- '- trigger: `%s` (%s)\n' "${GITHUB_EVENT_NAME}" "${REASON}"
            printf -- '- commit: `%s`\n' "${REVISION}"
            printf -- '- platform: `%s`\n' "${IMAGE_PLATFORM}"
            printf -- '- digest: `%s`\n\n' "${DIGEST:-not pushed}"
            printf '```\n%s\n```\n' "${TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          TITLE: ${{ github.event_name == 'pull_request' && 'Image validated (not published)' || 'Image published' }}
          REASON: ${{ inputs.reason || 'push' }}
          REVISION: ${{ steps.context.outputs.revision }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
