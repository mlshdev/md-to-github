name: Base image update

# Scans every external FROM in the Dockerfile against its registry, re-pins the
# tag and digest when a newer image exists, and rebuilds and republishes on any
# change. The rebuild is a direct workflow_call rather than a push trigger,
# because pushes made with GITHUB_TOKEN do not start new workflow runs.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report available updates without committing or rebuilding."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  scan:
    name: Scan Dockerfile layers
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.commit.outputs.updated }}
      revision: ${{ steps.commit.outputs.revision }}
      images: ${{ steps.scan.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Read the Bun version pinned in the Dockerfile
        id: toolchain
        run: |
          set -euo pipefail
          version="$(sed -n 's|^FROM docker\.io/oven/bun:\([0-9][0-9A-Za-z.-]*\)@sha256:.*|\1|p' Dockerfile | head -n 1)"
          test -n "${version}"
          printf 'bun=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.toolchain.outputs.bun }}

      - name: Resolve the newest permitted tag and digest for every layer
        id: scan
        run: bun run .github/scripts/update-base-images.ts Dockerfile ${{ inputs.dry-run && '--dry-run' || '' }}

      - uses: docker/setup-buildx-action@v4
        if: steps.scan.outputs.updated == 'true' && !inputs.dry-run

      # Validate before committing so a broken base image never lands on main.
      - name: Build the updated image
        if: steps.scan.outputs.updated == 'true' && !inputs.dry-run
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: markdown-mermaid-renderer:base-update
          cache-from: type=gha,scope=linux-arm64
          cache-to: type=gha,scope=linux-arm64,mode=max

      - name: Smoke test the updated image
        if: steps.scan.outputs.updated == 'true' && !inputs.dry-run
        run: .github/scripts/smoke-test.sh markdown-mermaid-renderer:base-update

      - name: Commit the new pins
        id: commit
        run: |
          set -euo pipefail
          if [ "${UPDATED}" != "true" ] || [ "${DRY_RUN}" = "true" ]; then
            printf 'updated=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "deps(docker): re-pin base images to ${IMAGES}"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          {
            printf 'updated=true\n'
            printf 'revision=%s\n' "$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"
        env:
          UPDATED: ${{ steps.scan.outputs.updated }}
          DRY_RUN: ${{ inputs.dry-run }}
          IMAGES: ${{ steps.scan.outputs.images }}

  rebuild:
    name: Rebuild and publish
    needs: scan
    if: needs.scan.outputs.updated == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.scan.outputs.revision }}
      reason: base image update
